<a class="card" href="{{ site.url }}{{ post.url }}">
    <span class="meta">{% assign fecha = post.date %}{% include fecha.html %}</span>
    <h3 class="title">{{ post.title }}</h3>
    {% if post.description %}<p class="desc">{{ post.description }}</p>{% endif %}
    {% if post.tags.size > 0 %}
        <div class="tags">
            {% for tag in post.tags limit: 5 %}<span class="tag">{{ tag | remove: "," }}</span>{% endfor %}
        </div>
    {% endif %}
</a>
