<nav class="nav" aria-label="Principal">
    <ul class="list">
        <li class="item">
            <a class="link{% if page.title == 'Home' %} active{% endif %}" href="{{ site.url }}/">Inicio</a>
        </li>

        {% if site.blog == true %}
            <li class="item">
                <a class="link{% if page.title == 'Blog' or page.layout == 'post' %} active{% endif %}" href="{{ site.url }}/blog">Proyectos</a>
            </li>
        {% endif %}

        {% if site.projects == true %}
            <li class="item">
                <a class="link{% if page.title == 'Projects' %} active{% endif %}" href="{{ site.url }}/projects">Proyectos</a>
            </li>
        {% endif %}

        {% if site.about == true %}
            <li class="item">
                <a class="link{% if page.title == 'About' %} active{% endif %}" href="{{ site.url }}/about">Sobre mí</a>
            </li>
        {% endif %}

        {% if site.resume == true %}
            <li class="item">
                <a class="link cv" href="{% if site.resume-external %}{{ site.resume-url }}{% else %}{{ site.url }}/{{ site.resume-url }}{% endif %}" target="_blank" rel="noopener">Currículum</a>
            </li>
        {% endif %}
    </ul>
</nav>
